services:
    db:
        image: postgres:15
        environment:
            POSTGRES_DB: assessx
            POSTGRES_USER: ${DB_USER:-assessx}
            POSTGRES_PASSWORD: ${DB_PASS:-assessx}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-assessx} -d assessx"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        volumes:
            - assessx_sandbox:/sandbox
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            DB_URL: db
            DB_PORT: 5432
            DB_NAME: assessx
            DB_USER: ${DB_USER:-assessx}
            DB_PASS: ${DB_PASS:-assessx}
            GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
            GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
            JWT_SECRET: ${JWT_SECRET}
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            OLLAMA_TIMEOUT_SEC: ${OLLAMA_TIMEOUT_SEC:-60}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata:
    assessx_sandbox:
        name: assessx_sandbox
